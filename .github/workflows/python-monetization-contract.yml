name: Python Monetization Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "python-ai/services/ai_monetization/**"
      - "python-ai/tests/test_ai_monetization_contract.py"
      - "python-ai/tests/test_ai_monetization_queue.py"
      - ".github/workflows/python-monetization-contract.yml"

permissions:
  contents: read

jobs:
  monetization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONPATH: python-ai/services/ai_monetization
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal contract dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 fastapi==0.115.6 pydantic==2.10.4 \
            redis==5.2.1 joblib==1.4.2
      - name: Compile Monetization source and tests
        run: |
          python -m py_compile \
            python-ai/services/ai_monetization/app.py \
            python-ai/services/ai_monetization/core/feature_builder.py \
            python-ai/services/ai_monetization/core/model_loader.py \
            python-ai/services/ai_monetization/routes/promotion.py \
            python-ai/services/ai_monetization/train_model.py \
            python-ai/tests/test_ai_monetization_contract.py \
            python-ai/tests/test_ai_monetization_queue.py
      - name: Verify feature, fallback and model-state contracts
        run: python python-ai/tests/test_ai_monetization_contract.py -v
      - name: Verify feedback idempotency, failure safety and atomic queue snapshot
        run: python python-ai/tests/test_ai_monetization_queue.py -v

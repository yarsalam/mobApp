name: Growth acquisition contract

on:
  push:
    branches: [infra/staging-ai-lab-2026-11]
    paths:
      - "src/seo/**"
      - "src/admin-api/controllers/seo/**"
      - ".github/workflows/growth-acquisition-contract.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "src/seo/**"
      - "src/admin-api/controllers/seo/**"
      - ".github/workflows/growth-acquisition-contract.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  growth-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test acquisition funnel contract
        run: npm test -- --runInBand seo/services/acquisition-growth.service.spec.ts
      - name: Compile backend
        run: npm run build

name: Backend Revenue Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src/revenue/**"
      - "src/admin-api/controllers/revenue/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-revenue-quality.yml"

permissions:
  contents: read

jobs:
  revenue-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Revenue analytics unit tests
        run: npm test -- --runInBand revenue-analytics.service.spec.ts

      - name: Compile backend
        run: npm run build

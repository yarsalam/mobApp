name: Backend Revenue Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src/personality/**"
      - "src/feature-store/**"
      - "src/suggestion/scoring/**"
      - "src/ai-assistant/**"
      - "src/revenue/**"
      - "src/moderation/**"
      - "src/app.controller.ts"
      - "src/app.controller.spec.ts"
      - "src/redis/redis.service.ts"
      - "src/message/**"
      - "python-ai/services/ai_moderation/**"
      - "python-ai/tests/test_ai_moderation_fail_closed.py"
      - "src/admin-api/controllers/revenue/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-revenue-quality.yml"

permissions:
  contents: read

jobs:
  revenue-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Revenue and moderation unit tests
        run: npm test -- --runInBand revenue-analytics.service.spec.ts personality.service.spec.ts app.controller.spec.ts

      - name: Compile backend
        run: npm run build

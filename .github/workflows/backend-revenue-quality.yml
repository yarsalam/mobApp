name: Backend Revenue Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src/personality/**"
      - "src/feature-store/**"
      - "src/suggestion/scoring/**"
      - "src/ai-assistant/**"
      - "src/revenue/**"
      - "src/moderation/**"
      - "src/app.controller.ts"
      - "src/app.controller.spec.ts"
      - "src/redis/redis.service.ts"
      - "src/message/**"
      - "src/payments/**"
      - "src/user-event/**"
      - "python-ai/services/ml_service/**"
      - "python-ai/tests/test_matching_scoring.py"
      - "python-ai/services/ai_moderation/**"
      - "python-ai/tests/test_ai_moderation_fail_closed.py"
      - "src/admin-api/controllers/revenue/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-revenue-quality.yml"

permissions:
  contents: read

jobs:
  revenue-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Revenue, payments and moderation unit tests
        run: >-
          npm test -- --runInBand
          revenue-analytics.service.spec.ts
          personality.service.spec.ts
          app.controller.spec.ts
          payments.service.spec.ts
          wallet.service.spec.ts
          card-transfer.provider.spec.ts
          manual-verifier.service.spec.ts

      - name: Compile backend
        run: npm run build

  matching-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy fastapi pydantic pydantic-settings httpx redis
      - name: Run matching fail-closed and persistence tests
        working-directory: python-ai
        run: python -m pytest -q tests/test_matching_scoring.py

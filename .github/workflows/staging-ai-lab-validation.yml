name: Staging AI Lab validation

concurrency:
  group: staging-ai-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "docker-compose.staging.yml"
      - ".env.staging.example"
      - "scripts/staging/**"
      - "scripts/ai-eval/**"
      - "python-ai/staging-base-images/**"
      - "python-ai/downloaded_wheels/.gitkeep"
      - ".github/workflows/staging-ai-lab-validation.yml"
      - "docs/STAGING_AI_LAB.md"
      - ".devcontainer/devcontainer.json"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "docker-compose.staging.yml"
      - "scripts/staging/**"
      - "scripts/ai-eval/**"
      - "python-ai/staging-base-images/**"
      - ".github/workflows/staging-ai-lab-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-config-and-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated throwaway environment
        run: |
          cp .env.staging.example .env.staging
          chmod 600 .env.staging

      - name: Validate shell scripts
        run: bash -n scripts/staging/bootstrap.sh scripts/staging/ai-service.sh scripts/staging/build-ai-base.sh scripts/staging/prepare-embedding-model.sh scripts/staging/codespaces-start.sh

      - name: Validate Python evaluation scripts
        run: python -m py_compile scripts/ai-eval/generate_fixtures.py scripts/ai-eval/test_fixtures.py scripts/ai-eval/evaluate_moderation.py

      - name: Validate Codespaces devcontainer configuration
        run: python -m json.tool .devcontainer/devcontainer.json >/dev/null

      - name: Validate staging Compose without starting services
        run: |
          docker compose version
          docker compose --env-file .env.staging \
            -p yarsalam-staging-validation \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f docker-compose.staging.yml config --quiet

      - name: Validate every AI service profile independently
        run: |
          set -euo pipefail
          check_profile() {
            profile="$1"
            expected="$2"
            services="$(docker compose --env-file .env.staging \
              -p yarsalam-staging-validation \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              -f docker-compose.staging.yml \
              --profile "$profile" config --services)"
            printf '%s\n' "$services" | grep -Fx "$expected" >/dev/null
          }
          check_profile ai-ops ai_ops
          check_profile ai-feedback ai_feedback
          check_profile ai-seo ai_seo
          check_profile ai-monetization ai_monetization
          check_profile ai-revenue ai_revenue
          check_profile ai-assistant ai_assistant
          check_profile ai-moderation ai_moderation
          check_profile ai-moderation embedded_ai
          check_profile ai-verification ai_verification
          check_profile ai-embedding embedded_ai
          check_profile ai-matching ml_service
          check_profile ai-matching embedded_ai
          check_profile ai-uplift ai_uplift
          check_profile ai-backlink-quality ai_backlink_quality
          check_profile ai-seo-recommender ai_seo_recommender
          check_profile ai-personality personality
          check_profile ai-image ai_image
          check_profile ai-support ai_support
          check_profile ai-aeo aeo_tracker

      - name: Generate deterministic synthetic fixtures
        run: |
          python scripts/ai-eval/generate_fixtures.py \
            --seed 20261110 \
            --output "$RUNNER_TEMP/yarsalam-ai-eval"

      - name: Validate synthetic fixture contracts
        working-directory: scripts/ai-eval
        run: python -m unittest -v test_fixtures.py test_moderation_rules.py

      - name: Upload synthetic AI evaluation fixtures
        uses: actions/upload-artifact@v4
        with:
          name: yarsalam-ai-eval-synthetic-fixtures
          path: ${{ runner.temp }}/yarsalam-ai-eval/
          retention-days: 14
          if-no-files-found: error
  
  staging-runtime-ai-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fresh isolated staging secrets
        run: bash scripts/staging/bootstrap.sh

      - name: Start the isolated base stack
        run: bash scripts/staging/ai-service.sh base-up

      - name: Verify backend MySQL and Redis readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5001/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend database/Redis readiness did not become healthy."
          docker compose --env-file .env.staging -p yarsalam-staging \
            -f docker-compose.yml -f docker-compose.production.yml \
            -f docker-compose.staging.yml logs --no-color --tail=100 backend user-mysql redis
          exit 1

      - name: Build and start only AI Ops
        run: bash scripts/staging/ai-service.sh ai-up ai_ops

      - name: Verify AI Ops HTTP health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18025/health; then
              exit 0
            fi
            sleep 2
          done
          echo "AI Ops health endpoint did not become ready."
          exit 1

      - name: Capture staging logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging -p yarsalam-staging \
            -f docker-compose.yml -f docker-compose.production.yml \
            -f docker-compose.staging.yml logs --no-color --tail=120 || true

      - name: Stop staging containers without deleting volumes
        if: always()
        run: |
          if [[ -s .env.staging ]]; then
            docker compose --env-file .env.staging -p yarsalam-staging \
              -f docker-compose.yml -f docker-compose.production.yml \
              -f docker-compose.staging.yml stop ai_ops backend qdrant user-mysql redis || true
          fi

  staging-runtime-moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create fresh isolated staging secrets
        run: bash scripts/staging/bootstrap.sh

      - name: Generate deterministic synthetic moderation fixtures
        run: |
          python scripts/ai-eval/generate_fixtures.py \
            --seed 20261110 \
            --output "$RUNNER_TEMP/yarsalam-ai-eval"

      - name: Build and start Moderation with its real Embedding model
        run: bash scripts/staging/ai-service.sh ai-up ai_moderation

      - name: Verify model and service readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:18104/health | \
              python -c 'import json,sys; d=json.load(sys.stdin); assert d["model_loaded"] is True and d["redis"] is True and d["dimension"] == 384'
            then
              break
            fi
            sleep 10
          done
          curl --fail --silent http://127.0.0.1:18104/health
          curl --fail --silent http://127.0.0.1:18018/health

      - name: Run the synthetic Persian moderation evaluation
        run: |
          python scripts/ai-eval/evaluate_moderation.py \
            --fixtures "$RUNNER_TEMP/yarsalam-ai-eval/moderation_cases.jsonl" \
            --output "$RUNNER_TEMP/moderation-evaluation.json"

      - name: Upload moderation evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarsalam-moderation-evaluation
          path: |
            ${{ runner.temp }}/moderation-evaluation.json
            ${{ runner.temp }}/yarsalam-ai-eval/manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Capture moderation and embedding logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging -p yarsalam-staging \
            -f docker-compose.yml -f docker-compose.production.yml \
            -f docker-compose.staging.yml logs --no-color --tail=160 \
            ai_moderation embedded_ai redis user-mysql || true

      - name: Stop staging containers without deleting volumes
        if: always()
        run: |
          if [[ -s .env.staging ]]; then
            docker compose --env-file .env.staging -p yarsalam-staging \
              -f docker-compose.yml -f docker-compose.production.yml \
              -f docker-compose.staging.yml stop \
              ai_moderation embedded_ai user-mysql redis || true
          fi

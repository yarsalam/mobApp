name: Python AI pack readiness

on:
  pull_request:
    paths:
      - "python-ai/services/**"
      - "python-ai/tests/**"
      - ".github/workflows/python-ai-pack-readiness.yml"
  push:
    branches: [main]
    paths:
      - "python-ai/services/**"
      - "python-ai/tests/**"
      - ".github/workflows/python-ai-pack-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.4.2 fastapi==0.115.12 pydantic==2.10.6 redis==5.2.1 httpx==0.28.1 python-multipart==0.0.20 Pillow==11.1.0 beautifulsoup4==4.13.3
      - name: Compile service source
        run: python -m compileall -q python-ai/services
      - name: Run focused regression tests
        run: python -m pytest -q python-ai/tests/test_pack_readiness.py

name: Python Moderation Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "python-ai/services/ai_moderation/**"
      - "python-ai/tests/test_ai_moderation_fail_closed.py"
      - ".github/workflows/python-moderation-contract.yml"

permissions:
  contents: read

jobs:
  moderation-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal moderation test dependency
        run: python -m pip install httpx==0.27.2
      - name: Compile moderation source
        run: python -m py_compile python-ai/services/ai_moderation/app.py python-ai/services/ai_moderation/moderation_engine.py python-ai/services/ai_moderation/moderation_rules.py
      - name: Verify fail-closed behavior
        env:
          PYTHONPATH: python-ai/services/ai_moderation
        run: python python-ai/tests/test_ai_moderation_fail_closed.py -v
